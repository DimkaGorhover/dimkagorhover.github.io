[tools]
hugo = "0.164.0"

[tasks.serve]
description = "Local dev server with drafts, http://localhost:1313"
run = "hugo server --buildDrafts"

[tasks.build]
description = "Production build into ./public"
run = "hugo --gc --minify"

[tasks.deploy]
description = "Manual release: build and force-push ./public to the gh-page branch"
depends = ["build"]
run = """
set -eu
touch public/.nojekyll
cd public
git init -q
git add -A
git commit -qm "deploy $(git -C .. rev-parse --short HEAD)"
git push -qf "$(git -C .. remote get-url origin)" HEAD:gh-page
rm -rf .git
"""

[tasks.clean]
description = "Remove build artifacts"
quiet = true
run = """
if command -v trash > /dev/null 2>&1; then
  exec trash public resources .hugo_build.lock
fi
exec rm -rf public resources .hugo_build.lock
"""

[tasks.refresh-projects]
description = "Refresh data/projects.yaml with live GitHub metadata"
run = "uv run scripts/refresh_projects.py"
